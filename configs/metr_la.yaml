experiment: metr_la_node_disjoint_evaluation
data_dir: data/METR-LA
frozen_results_dir: results/frozen/metr_la_topology_disjoint
output_dir: results/reproduced/metr_la_topology_disjoint
matrix_direction: "A[j,i] = j -> i"
node_split:
  rule: location_only_morton_z_order
  group_size: 20
  development_group_ids: [0, 3, 6, 9]
  test_group_ids: [1, 2, 4, 5, 7, 8]
candidate_relations:
  definition: all_directed_nonself_pairs
  directed_pair_count: 380
observation_ratios: [0.4, 0.7]
mask_repetitions: [0, 1]
gat:
  input_dim: 12
  hidden_per_head: 12
  heads: 2
  learning_rate: 0.005
  weight_decay: 0.0001
  max_epochs: 300
  patience: 30
  min_delta: 1.0e-7
  internal_validation_fraction: 0.20
ridge:
  lambda_grid: [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]
  selected_lambda: 100.0
  selection: leave_one_development_graph_out
aggregation:
  epsilon: 0.01
signal_metric:
  name: metr_la_temporal_l2_deviation
  definition: "mean over evaluation windows of ||sum_i (w_i-w_i_star) X_i^(t)||_2"
statistics:
  unit: test_graph
  masks_averaged_within_graph: 2
  exact_signflip: true
  cluster_bootstrap_repetitions: 5000
temporal_scope:
  train_fraction: 0.70
  evaluation_end_fraction: 0.80
